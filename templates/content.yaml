# Content slide chrome — header band, accent rule, footer on the slide master.
# Headings stay in each slide YAML (not baked into the master).
title: RISC-V市場予測（SHD Group 2026）
author: create-slides
subject: SHD102-26 Abridged, April 2026

size:
  width: 13.333
  height: 7.5

background: "FFFEFA"
lang: ja-JP

fonts:
  default: Yu Gothic UI
  heading: Yu Gothic UI

colors:
  background: "FFFEFA"
  text: "1B2430"
  muted: "5C6B7A"
  accent: "0B6BCB"
  navy: "1B365D"
  accent2: "0F9D58"
  accent3: "C97800"
  accent4: "7C3AED"
  card: "FFFFFF"
  header: "E8F3FF"
  footer: "F3F1EA"
  line: "C5CDD6"

elements:
  - type: shape
    shape: rect
    x: 0
    y: 0
    w: 13.333
    h: 0.72
    fill: header
  - type: shape
    shape: rect
    x: 0
    y: 0.72
    w: 13.333
    h: 0.055
    fill: accent
  - type: shape
    shape: rect
    x: 0
    y: 7.02
    w: 13.333
    h: 0.48
    fill: footer
  - type: text
    text: SHD102-26 Abridged, April 2026, Tables 13–14（公開数値から再作図）
    x: 0.45
    y: 7.02
    w: 10.2
    h: 0.48
    fontSize: 16
    color: muted
    valign: middle
    wrap: false

pageNumber:
  x: 10.8
  y: 7.02
  w: 2.1
  h: 0.48
  fontSize: 18
  color: muted
  align: right
  valign: middle
  text: "{{page}} / {{pages}}"
