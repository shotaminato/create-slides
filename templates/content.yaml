# Content slide: header/footer chrome on the master.
# `id: heading` / `id: headingNote` are per-slide slots (slides override text).
title: RISC-V 入門＆市場動向（2026年10月）
author: create-slides
subject: 基礎からSHD予測まで／出典付き

size:
  width: 13.333
  height: 7.5

background: "FFFEFA"
lang: ja-JP

fonts:
  default: Yu Gothic UI
  heading: Yu Gothic UI

colors:
  background: "FFFEFA"
  text: "1B2430"
  muted: "5C6B7A"
  accent: "0B6BCB"
  navy: "1B365D"
  accent2: "0F9D58"
  accent3: "C97800"
  accent4: "7C3AED"
  card: "FFFFFF"
  header: "E8F3FF"
  footer: "F3F1EA"
  line: "C5CDD6"

elements:
  - type: shape
    shape: rect
    x: 0
    y: 0
    w: 13.333
    h: 0.72
    fill: header
  - type: shape
    shape: rect
    x: 0
    y: 0.72
    w: 13.333
    h: 0.055
    fill: accent
  - type: shape
    shape: rect
    x: 0
    y: 7.02
    w: 13.333
    h: 0.48
    fill: footer
  - type: text
    text: RISC-V 入門＆市場動向  ·  2026年10月
    x: 0.45
    y: 7.02
    w: 10.2
    h: 0.48
    fontSize: 16
    color: muted
    valign: middle
    wrap: false

  - id: heading
    type: text
    x: 0.45
    y: 0.04
    w: 12.4
    h: 0.64
    fontSize: 28
    bold: true
    color: text
    valign: middle
    wrap: false
  - id: headingNote
    type: text
    x: 8.7
    y: 0.08
    w: 4.2
    h: 0.55
    fontSize: 16
    color: muted
    align: right
    valign: middle
    wrap: false

pageNumber:
  x: 10.8
  y: 7.02
  w: 2.2
  h: 0.48
  fontSize: 18
  color: muted
  align: right
  valign: middle
  wrap: false
  text: "{{page}} / {{pages}}"
