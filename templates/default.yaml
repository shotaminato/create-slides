# Shared visual language (also used when a slide sets template: default).
# Chrome goes on the slide master; page numbers are injected per slide.
title: RISC-V 入門＆市場動向（2026年10月）
author: create-slides
subject: 基礎からSHD予測まで／出典付き

size:
  width: 13.333
  height: 7.5

background: "FFFEFA"
lang: ja-JP

fonts:
  default: Yu Gothic UI
  heading: Yu Gothic UI

colors:
  background: "FFFEFA"
  text: "1B2430"
  muted: "5C6B7A"
  accent: "0B6BCB"
  navy: "1B365D"
  accent2: "0F9D58"
  accent3: "C97800"
  accent4: "7C3AED"
  card: "FFFFFF"
  header: "E8F3FF"
  footer: "F3F1EA"
  line: "C5CDD6"

elements:
  - type: shape
    shape: rect
    x: 0
    y: 7.02
    w: 13.333
    h: 0.48
    fill: footer
  - type: text
    text: RISC-V 入門＆市場動向  ·  2026年10月
    x: 0.32
    y: 7.02
    w: 10.35
    h: 0.48
    fontSize: 16
    color: muted
    valign: middle
    wrap: false

pageNumber:
  x: 10.8
  y: 7.02
  w: 2.2
  h: 0.48
  fontSize: 18
  color: muted
  align: right
  valign: middle
  wrap: false
  text: "{{page}} / {{pages}}"
