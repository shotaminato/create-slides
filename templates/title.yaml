# Title slide chrome — lives on the PowerPoint slide master (pptxgenjs defineSlideMaster).
# Slide YAML supplies title/content. Page numbers are injected at render time.
title: RISC-V 入門
author: create-slides
subject: オープンな命令セットアーキテクチャ

size:
  width: 13.333
  height: 7.5

background: "FFFEFA"
lang: ja-JP

fonts:
  default: Yu Gothic UI
  heading: Yu Gothic UI

colors:
  background: "FFFEFA"
  text: "1B2430"
  muted: "5C6B7A"
  accent: "0B6BCB"
  accent2: "0F9D58"
  accent3: "C97800"
  accent4: "7C3AED"
  card: "FFFFFF"
  header: "E8F3FF"
  footer: "F3F1EA"
  line: "C5CDD6"

elements:
  - type: shape
    shape: rect
    x: 0
    y: 0
    w: 0.16
    h: 7.5
    fill: accent
  - type: shape
    shape: rect
    x: 0
    y: 7.02
    w: 13.333
    h: 0.48
    fill: footer
  - type: text
    text: RISC-V 入門  ·  オープン ISA
    x: 0.55
    y: 7.02
    w: 10.1
    h: 0.48
    fontSize: 18
    color: muted
    valign: middle

pageNumber:
  x: 10.8
  y: 7.02
  w: 2.1
  h: 0.48
  fontSize: 18
  color: muted
  align: right
  valign: middle
  text: "{{page}} / {{pages}}"
