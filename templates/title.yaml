  - type: shape
    shape: rect
    x: 0
    y: 7.12
    w: 13.333
    h: 0.38
    fill: footer
  - type: text
    text: RISC-V 入門  ·  オープン ISA
    x: 0.55
    y: 7.12
    w: 10.1
