# Title slide chrome — light cream canvas, left accent, footer
title: RISC-V 入門
author: create-slides
subject: オープンな命令セットアーキテクチャ

size:
  width: 13.333
  height: 7.5

background: "FFFEFA"
lang: ja-JP

fonts:
  default: Yu Gothic UI
  heading: Yu Gothic UI

colors:
  background: "FFFEFA"
  text: "1B2430"
  muted: "5C6B7A"
  accent: "0B6BCB"
  accent2: "0F9D58"
  accent3: "C97800"
  accent4: "7C3AED"
  card: "FFFFFF"
  header: "E8F3FF"
  footer: "F3F1EA"
  line: "C5CDD6"

elements:
