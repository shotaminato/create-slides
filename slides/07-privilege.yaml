  - type: text
    text: "M-mode はすべての実装に必要です。\n\nUnix 系 OS は S-mode と U-mode を載せます。\n\n仮想化は Hypervisor（H）拡張です。\n\nトラップはより高い特権へ渡り、mret / sret で戻ります。"
