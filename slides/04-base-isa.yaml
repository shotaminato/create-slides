    fontSize: 16
    bold: true
    color: text

  - type: text
    text: "ABI 名の例: ra, sp, gp, tp, t0–t6, s0–s11, a0–a7。浮動小数点レジスタは F / D 拡張で別途追加します。"
    x: 3.1
    y: 5.25
    w: 9.65
    h: 1.55
    fontSize: 14
    color: muted
