    y: 0.06
    w: 12.4
    h: 0.5
    fontSize: 22
    bold: true
    color: text
    valign: middle

  - type: text
    text: "整数ベースは RV32I / RV64I / RV128I。組み込み向けにレジスタ 16 本の RV32E もあります。命令は基本 32 ビットです。"
    x: 0.5
    y: 0.85
    w: 12.3
    h: 0.55
    fontSize: 15
    color: text

