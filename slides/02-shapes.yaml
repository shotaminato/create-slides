template: default
notes: Shape showcase — rect, roundRect, ellipse, triangle, block arrows, and line arrows.

elements:
  - type: text
    text: Shape showcase
    x: 0.5
    y: 0.22
    w: 12.3
    h: 0.5
    fontSize: 26
    bold: true
    color: text

  # Row 1 — rectangles & ellipse
  - type: shape
    shape: rect
    x: 0.5
    y: 0.9
    w: 3.8
    h: 1.55
    fill: accent
    text: rect
    fontSize: 16
    bold: true
    color: "0F172A"

  - type: shape
    shape: roundRect
    x: 4.75
    y: 0.9
    w: 3.8
    h: 1.55
    fill: accent2
    rectRadius: 0.2
    text: roundRect
    fontSize: 16
    bold: true
    color: "0F172A"

  - type: shape
    shape: ellipse
    x: 9.0
    y: 0.85
    w: 3.8
    h: 1.65
    fill: accent3
    text: ellipse
    fontSize: 16
    bold: true
    color: "0F172A"

  # Row 2 — block arrows
  - type: shape
    shape: rightArrow
    x: 0.5
    y: 2.85
    w: 3.8
    h: 1.1
    fill: accent4
    text: rightArrow
    fontSize: 14
    bold: true
    color: "0F172A"

  - type: shape
    shape: leftArrow
    x: 4.75
    y: 2.85
    w: 3.8
    h: 1.1
    fill: accent
    text: leftArrow
    fontSize: 14
    bold: true
    color: "0F172A"

  - type: shape
    shape: upArrow
    x: 9.35
    y: 2.7
    w: 1.35
    h: 1.4
    fill: accent2
    text: up
    fontSize: 12
    bold: true
    color: "0F172A"

  - type: shape
    shape: downArrow
    x: 11.05
    y: 2.7
    w: 1.35
    h: 1.4
    fill: accent3
    text: down
    fontSize: 12
    bold: true
    color: "0F172A"

  # Row 3 — line arrows + extra block arrows
  - type: shape
    shape: line
    x: 0.5
    y: 4.7
    w: 3.8
    h: 0.05
    line:
      color: accent
      width: 2.5
      endArrowType: arrow
      beginArrowType: none

  - type: text
    text: line + endArrowType
    x: 0.5
    y: 4.95
    w: 3.8
    h: 0.35
    fontSize: 12
    color: muted
    align: center

  - type: shape
    shape: lineArrow
    x: 4.75
    y: 4.55
    w: 3.8
    h: 0.35
    line:
      color: accent2
      width: 2.5

  - type: text
    text: lineArrow alias
    x: 4.75
    y: 4.95
    w: 3.8
    h: 0.35
    fontSize: 12
    color: muted
    align: center

  - type: shape
    shape: lineDoubleArrow
    x: 9.0
    y: 4.55
    w: 3.8
    h: 0.35
    line:
      color: accent3
      width: 2.5

  - type: text
    text: lineDoubleArrow alias
    x: 9.0
    y: 4.95
    w: 3.8
    h: 0.35
    fontSize: 12
    color: muted
    align: center

  - type: shape
    shape: leftRightArrow
    x: 0.5
    y: 5.55
    w: 5.9
    h: 1.15
    fill: card
    line:
      color: accent
      width: 1.25
    text: leftRightArrow
    fontSize: 14
    bold: true
    color: text

  - type: shape
    shape: upDownArrow
    x: 7.0
    y: 5.45
    w: 1.5
    h: 1.35
    fill: card
    line:
      color: accent2
      width: 1.25
    text: ↕
    fontSize: 16
    color: text

  - type: shape
    shape: triangle
    x: 9.0
    y: 5.4
    w: 3.8
    h: 1.35
    fill: card
    line:
      color: accent4
      width: 1.25
    text: triangle
    fontSize: 14
    bold: true
    color: text
